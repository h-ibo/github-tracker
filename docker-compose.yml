services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [redis, db]
    volumes: ["./app:/app/app"]

  worker:
    build: .
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    env_file: .env
    depends_on: [redis, db]
    volumes: ["./app:/app/app"]
    

  beat:
    build: .
    command: celery -A app.celery_app:celery_app beat --loglevel=info
    env_file: .env
    depends_on: [redis]
    volumes: ["./app:/app/app"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repotracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

volumes:
  pgdata:
